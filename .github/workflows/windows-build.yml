name: Windows build

on:
  push:
    branches: [windows-port]
    paths: ["windows/**", "Extensions/**", ".github/workflows/windows-build.yml"]
  pull_request:
    paths: ["windows/**", "Extensions/**"]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run typecheck
      - run: npm run build:web

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "windows/src-tauri" }
      - run: npm install
      - name: cargo check
        working-directory: windows/src-tauri
        run: cargo check
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: SuperIsland-windows
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/msi/*.msi
